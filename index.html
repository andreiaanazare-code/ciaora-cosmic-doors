<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050409"><title>CIAORA — The Invitation</title><meta name="description" content="Um convite para descobrir as portas da possibilidade."><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap');*{box-sizing:border-box}html,body{margin:0;background:#050409;color:#f5e9d5;font-family:Inter,sans-serif}button{font:inherit}main{min-height:100svh;position:relative;overflow:hidden}video{position:absolute;width:100%;height:100%;object-fit:cover;inset:0;filter:brightness(.72)}.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,3,8,.52),transparent 35%,rgba(3,3,8,.7))}.brand{position:absolute;top:32px;left:6vw;font:300 21px 'Cormorant Garamond',serif;letter-spacing:.4em;z-index:2}.step{position:absolute;bottom:13%;left:8%;right:8%;z-index:2;max-width:850px}.step h1{font:300 clamp(48px,8vw,112px)/.95 'Cormorant Garamond',serif;margin:0 0 20px;text-shadow:0 0 28px #cba56877}.step p{font:300 clamp(15px,2vw,20px)/1.7 Inter,sans-serif;letter-spacing:.13em}.controls{position:absolute;bottom:30px;right:5vw;z-index:3;display:flex;gap:12px}button{cursor:pointer;border:1px solid #d9b87b80;color:#f7e6c8;background:#0b0911aa;border-radius:30px;padding:13px 21px;letter-spacing:.08em}button:hover,button:focus-visible{background:#8d683b66;outline:2px solid #dfbd80;outline-offset:3px}.hidden{display:none!important}.doors{position:relative;z-index:3;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:90px 5vw;background:radial-gradient(ellipse at center,#282039 0,#07060e 67%)}.doors h2{font:300 clamp(50px,8vw,100px) 'Cormorant Garamond',serif;margin:0}.doors>p{font:300 15px Inter,sans-serif;letter-spacing:.25em;text-align:center}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;width:min(1100px,100%);margin:55px 0}.door{height:310px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:25px 10px;background:linear-gradient(155deg,#181521,#09080c);border:1px solid #bda16a66;border-radius:110px 110px 5px 5px;box-shadow:inset 0 0 55px #e1ae4420,0 0 20px #e0b75e0c;transition:transform .6s,box-shadow .6s}.door:hover,.door:focus-visible{transform:translateY(-12px);box-shadow:inset 0 0 65px #e1ae4440,0 0 45px #e0b75e40}.door strong{font:300 28px 'Cormorant Garamond',serif}.door span{font-size:11px;margin-top:20px}.note{min-height:2em;color:#d9c5a7;text-align:center}.footer{font:300 25px 'Cormorant Garamond',serif;letter-spacing:.1em}@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.door{height:225px}.door strong{font-size:22px}.step{bottom:19%}.controls{bottom:20px}.doors{padding-top:100px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body><main id="film"><div class="brand">CIAORA</div><video id="scene" playsinline muted autoplay preload="auto" aria-label="Convite cinematográfico da CIAORA"></video><div class="veil"></div><div class="step"><h1 id="line">Senta-te.</h1><p id="sub">Há mais possibilidades do que imaginas.</p></div><div class="controls"><button id="sound" aria-label="Ativar ou desativar som">Som: desligado</button><button id="skip">Explorar as portas →</button></div></main><section class="doors hidden" id="doors" aria-labelledby="door-title"><div class="brand">CIAORA</div><p>THE INVITATION</p><h2 id="door-title">Qual é a tua porta?</h2><p>Não existe uma única forma de começar.</p><div class="grid"><button class="door" data-name="AETERNA"><strong>AETERNA</strong><span>BATER À PORTA →</span></button><button class="door" data-name="Las Mujeres"><strong>Las Mujeres</strong><span>BATER À PORTA →</span></button><button class="door" data-name="Financial Empire"><strong>Financial Empire</strong><span>BATER À PORTA →</span></button><button class="door" data-name="Por revelar"><strong>Por revelar</strong><span>BATER À PORTA →</span></button></div><p class="note" id="note" role="status"></p><p class="footer">Bem-vinda a casa.</p><button id="replay">↶ Rever o convite</button></section><script>
const scenes=[{src:'assets/01-pulso.mp4',line:'Senta-te.',sub:'Tudo começa com uma possibilidade.'},{src:'assets/02-particulas.mp4',line:'Observa.',sub:'Há mundos à espera de serem descobertos.'},{src:'assets/03-universo.mp4',line:'Respira.',sub:'Não precisas de escolher já.'},{src:'assets/04-filme.mp4',line:'As portas estão à tua espera.',sub:'Aproxima-te. Descobre o que te chama.'}];const video=document.getElementById('scene'),line=document.getElementById('line'),sub=document.getElementById('sub');let idx=0;function play(i){idx=i;video.src=scenes[i].src;line.textContent=scenes[i].line;sub.textContent=scenes[i].sub;video.play().catch(()=>{line.textContent='Toca para começar';});}function finish(){video.pause();document.getElementById('film').classList.add('hidden');document.getElementById('doors').classList.remove('hidden');document.getElementById('door-title').focus?.();}video.addEventListener('ended',()=>idx<scenes.length-1?play(idx+1):finish());document.getElementById('skip').onclick=finish;document.getElementById('sound').onclick=e=>{video.muted=!video.muted;e.currentTarget.textContent=video.muted?'Som: desligado':'Som: ligado'};document.getElementById('replay').onclick=()=>{document.getElementById('doors').classList.add('hidden');document.getElementById('film').classList.remove('hidden');play(0)};const destinations={};document.querySelectorAll('.door').forEach(b=>b.onclick=()=>{const url=destinations[b.dataset.name];if(url)location.href=url;else document.getElementById('note').textContent=b.dataset.name+' — em breve. Esta porta ainda não tem um destino confirmado.'});play(0);
</script></body></html>
