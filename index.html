<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b0d"><title>CIAORA — The Invitation</title><meta name="description" content="Quatro portas. Infinitas possibilidades. Welcome home."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--gold:#e8cfac;--cream:#f5e9dc}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#0c080b;color:var(--cream);font-family:Inter,Arial,sans-serif}button,a{font:inherit}button{cursor:pointer}.hidden{display:none!important}.hero{min-height:100svh;position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#130b0d url('assets/portals-art.png') center/cover no-repeat}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#100b0d88 0%,transparent 28%,transparent 68%,#100b0d88);z-index:-1}.hero nav{position:absolute;top:24px;left:4%;right:4%;display:flex;align-items:center;justify-content:space-between;gap:20px;z-index:2}.logo{font:300 28px 'Cormorant Garamond',serif;letter-spacing:.43em;color:#fff1dd;text-decoration:none;text-shadow:0 2px 15px #000}.logo small{display:block;font:300 9px Inter,sans-serif;letter-spacing:.55em;margin-top:6px}.navlinks{display:flex;gap:30px}.navlinks a{color:#f4e6d9;text-decoration:none;text-transform:uppercase;font-size:10px;letter-spacing:.28em;text-shadow:0 1px 6px #000}.pill{border:1px solid #e6cda8aa;border-radius:50px;padding:13px 21px;color:#fff0da;background:#1c1314a8;text-transform:uppercase;letter-spacing:.2em;font-size:10px;backdrop-filter:blur(10px)}.pill:hover,.pill:focus-visible{background:#6e4b38e0;outline:2px solid #e5c99e;outline-offset:3px}.intro{position:absolute;top:13%;width:100%;text-align:center;text-shadow:0 2px 18px #100707;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.55em;text-transform:uppercase}.intro h1{font:300 clamp(56px,7vw,125px)/.9 'Cormorant Garamond',serif;letter-spacing:.03em;margin:13px 0}.intro p{font-size:10px;letter-spacing:.45em}.doors{display:grid;grid-template-columns:repeat(4,1fr);gap:2%;position:absolute;left:8%;right:8%;top:36%;bottom:22%}.door{border:1px solid transparent;background:transparent;color:#fff5e5;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0 0;text-align:center;text-shadow:0 2px 12px #000}.door strong{font:400 clamp(17px,2vw,29px) 'Cormorant Garamond',serif;letter-spacing:.08em}.door em{display:block;margin-top:7px;font:300 clamp(7px,.65vw,10px) Inter,sans-serif;letter-spacing:.24em;font-style:normal;text-transform:uppercase}.door .pill{margin-bottom:2px}.door:hover .pill,.door:focus-visible .pill{background:#6e4b38e0}.door:focus-visible{outline:2px solid #fff0ce;outline-offset:4px}.bottom{position:absolute;bottom:6%;left:0;right:0;text-align:center;text-shadow:0 2px 12px #000}.bottom p{font:italic 25px 'Cormorant Garamond',serif;margin:0 0 15px}.status{position:absolute;bottom:2%;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.1em;min-height:1.5em}.film{position:fixed;inset:0;z-index:10;background:#050409;display:grid;place-items:center}.film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.65)}.film:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#03020855,transparent 40%,#030208aa);pointer-events:none}.film .filmtext{position:absolute;bottom:17%;left:8%;right:8%;z-index:2}.film h2{font:300 clamp(60px,9vw,125px) 'Cormorant Garamond',serif;margin:0}.film p{letter-spacing:.13em;font-size:14px}.film .actions{position:absolute;bottom:4%;right:5%;display:flex;gap:10px;z-index:3}.film .filmbrand{position:absolute;top:4%;left:5%;z-index:3}.hint{position:absolute;bottom:3%;left:5%;font-size:11px;letter-spacing:.12em;z-index:3}footer{background:#100b0d;text-align:center;padding:22px;color:#bda78e;font:300 12px Inter,sans-serif;letter-spacing:.25em}@media(max-width:800px){.hero{min-height:950px;background-position:center}.navlinks{display:none}.intro{top:14%}.intro h1{font-size:clamp(43px,11vw,70px)}.intro p{letter-spacing:.2em}.doors{top:32%;bottom:20%;left:6%;right:6%;grid-template-columns:repeat(2,1fr);gap:7% 3%}.door{background:#10090b88;border:1px solid #cda77b77;border-radius:100px 100px 6px 6px;padding:20px 5px 10px;backdrop-filter:blur(3px)}.door strong{font-size:23px}.door em{font-size:8px}.door .pill{font-size:9px;padding:10px 13px}.bottom{bottom:7%}.bottom p{font-size:21px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><main class="hero" id="inicio"><nav><a class="logo" href="#inicio">CIAORA<small>WELCOME HOME</small></a><div class="navlinks"><a href="#inicio">Início</a><a href="#convite" id="navfilm">O convite</a><a href="#portas">As portas</a></div><button class="pill" id="enter">Entrar no universo</button></nav><div class="intro"><div class="eyebrow">Há mais do que uma realidade.</div><h1>THE INVITATION</h1><p>QUATRO PORTAS. INFINITAS POSSIBILIDADES.</p></div><section class="doors" id="portas" aria-label="As quatro portas"><button class="door" data-name="AETERNA"><div><strong>AETERNA</strong><em>Expandir a consciência</em></div><span class="pill">Entrar →</span></button><button class="door" data-name="LAS MUJERES"><div><strong>LAS MUJERES</strong><em>Ritmo · Raiz · Real</em></div><span class="pill">Entrar →</span></button><button class="door" data-name="FINANCIAL EMPIRE"><div><strong>FINANCIAL EMPIRE</strong><em>Criar · Investir · Multiplicar</em></div><span class="pill">Entrar →</span></button><button class="door" data-name="POR REVELAR"><div><strong>POR REVELAR</strong><em>O que mais existe?</em></div><span class="pill">Explorar →</span></button></section><div class="bottom"><p>E se o que procuras... já te estivesse a chamar?</p><button class="pill" id="watch">▶ &nbsp; VER O FILME</button></div><div class="status" id="status" role="status" aria-live="polite"></div></main><div class="film hidden" id="convite" role="dialog" aria-modal="true" aria-label="O convite cinematográfico"><div class="logo filmbrand">CIAORA</div><video id="scene" playsinline muted preload="metadata"></video><div class="filmtext"><h2 id="line">Senta-te.</h2><p id="sub">Tudo começa com uma possibilidade.</p></div><div class="hint">O FILME · CIAORA</div><div class="actions"><button class="pill" id="sound">Ativar som</button><button class="pill" id="close">Voltar às portas →</button></div></div><footer>CIAORA · WELCOME HOME · 2026 — ∞</footer><script>
const scenes=[{src:'assets/01-pulso.mp4',line:'Senta-te.',sub:'Tudo começa com uma possibilidade.'},{src:'assets/02-particulas.mp4',line:'Observa.',sub:'Há mundos à espera de serem descobertos.'},{src:'assets/03-universo.mp4',line:'Respira.',sub:'Não precisas de escolher já.'},{src:'assets/04-filme.mp4',line:'As portas estão à tua espera.',sub:'Aproxima-te. Descobre o que te chama.'}];const film=document.getElementById('convite'),video=document.getElementById('scene'),line=document.getElementById('line'),sub=document.getElementById('sub'),status=document.getElementById('status');let idx=0;function play(i){idx=i;video.src=scenes[i].src;line.textContent=scenes[i].line;sub.textContent=scenes[i].sub;video.play().catch(()=>{sub.textContent='Toca no vídeo para iniciar o convite.'})}function openFilm(){film.classList.remove('hidden');document.body.style.overflow='hidden';play(0);document.getElementById('close').focus()}function closeFilm(){video.pause();film.classList.add('hidden');document.body.style.overflow='';document.getElementById('watch').focus()}video.addEventListener('ended',()=>idx<scenes.length-1?play(idx+1):closeFilm());video.addEventListener('error',()=>{sub.textContent='O vídeo não carregou. Verifica os ficheiros da pasta assets.'});document.getElementById('watch').onclick=openFilm;document.getElementById('enter').onclick=openFilm;document.getElementById('navfilm').onclick=e=>{e.preventDefault();openFilm()};document.getElementById('close').onclick=closeFilm;document.getElementById('sound').onclick=e=>{video.muted=!video.muted;e.currentTarget.textContent=video.muted?'Ativar som':'Desativar som'};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!film.classList.contains('hidden'))closeFilm()});const destinations={};document.querySelectorAll('.door').forEach(b=>b.onclick=()=>{const url=destinations[b.dataset.name];if(url)location.href=url;else status.textContent=b.dataset.name+' — destino ainda não confirmado.'});
</script></body></html>
